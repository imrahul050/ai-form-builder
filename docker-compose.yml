version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: formcraft_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - formcraft-net

  webserver:
    image: nginx:alpine
    container_name: formcraft_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
    networks:
      - formcraft-net

  db:
    image: mysql:8.0
    container_name: formcraft_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: formcraft_ai
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    networks:
      - formcraft-net

networks:
  formcraft-net:
    driver: bridge
